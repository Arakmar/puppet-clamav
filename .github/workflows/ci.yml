---
# The static validations and the unit tests come from the Vox Pupuli
# reusable workflow (https://github.com/voxpupuli/gha-puppet, basic.yml):
# rake validate (syntax, metadata, REFERENCE.md freshness), lint and check,
# RuboCop, then the unit tests on every OpenVox major version of
# metadata.json, each with the Ruby its packages ship. The clamav job checks
# the rendered configuration files with ClamAV itself.
#
# release.yml calls it before publishing a tag.

name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  puppet:
    name: Puppet
    uses: voxpupuli/gha-puppet/.github/workflows/basic.yml@v4

  clamav:
    name: ClamAV ${{ matrix.clamav }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # EPEL and Debian, Ubuntu and Arch Linux, and the latest release
        clamav:
          - '1.4.6'
          - '1.5.4'
          - latest
    env:
      BUNDLE_WITHOUT: release
      CLAMAV_VALIDATE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Install ClamAV
        env:
          GH_TOKEN: ${{ github.token }}
          CLAMAV_RELEASE: ${{ matrix.clamav }}
        # The upstream package installs clamd, freshclam and clamconf in
        # /usr/local. It has no clamav-milter, whose configuration clamconf
        # parses.
        run: |
          if [ "$CLAMAV_RELEASE" = latest ]; then
            tag="$(gh release view --repo Cisco-Talos/clamav --json tagName --jq .tagName)"
          else
            tag="clamav-$CLAMAV_RELEASE"
          fi
          gh release download "$tag" --repo Cisco-Talos/clamav --pattern "$tag.linux.x86_64.deb" --dir "$RUNNER_TEMP"
          sudo dpkg -i "$RUNNER_TEMP/$tag.linux.x86_64.deb"
      - name: Display ClamAV version
        run: clamscan --version
      - name: Validate the rendered configurations with ClamAV
        run: |
          bundle exec rake fixtures:prep
          bundle exec rspec spec/classes --tag clamav

  tests:
    name: Test suite
    if: always()
    needs:
      - puppet
      - clamav
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
